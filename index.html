<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Redirecionamentos ba.gov.br</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Sora:wght@600;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}

/* Layout: cabeçalho fixo com filtros, faixa-resumo das etapas e um quadro kanban (raias por órgão ou quadro geral) que rola nos dois eixos. Tema claro fixo, fundo branco. */
:root{
  color-scheme:light;
  --bg:#ffffff; --surface:#ffffff; --sunk:#f5f6f8; --line:#dde2e8;
  --fg:#17212b; --muted:#5b6876; --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e8eefc;
  --estadual:#0d7a6b; --estadual-soft:#dcf1ed; --federal:#9a5b00; --federal-soft:#f8ead2;
  --danger:#b4232c;
  /* cor forte (borda, número) e cor de preenchimento de cada etapa */
  --e0:#64748b; --e1:#7c4dcc; --e2:#4256d6; --e3:#1f7ad1; --e4:#b45c0a; --e5:#0d7f78; --e6:#4f7a10; --e7:#1d7d3c;
  --t0:#eef1f5; --t1:#f2ebfd; --t2:#e9ecfd; --t3:#e3effc; --t4:#fdefdf; --t5:#ddf4f1; --t6:#edf5dc; --t7:#dcf2e3;
  --shadow:0 1px 2px rgba(20,30,45,.07),0 1px 1px rgba(20,30,45,.04);
  --f-display:"Sora","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --col:200px;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}

.top{padding-block:14px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;background:var(--surface);border-bottom:1px solid var(--line)}
/* Cabeçalho preenchido */
.row1{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;justify-content:space-between;padding:20px 22px;border-radius:14px;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#2a64e8 0%,transparent 55%),linear-gradient(115deg,#0a2463 0%,#163fa8 48%,#1b74c9 100%);box-shadow:0 6px 20px rgba(16,48,120,.22)}
.row1::before,.row1::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.row1::before{width:260px;height:260px;right:-60px;top:-130px;background:rgba(255,255,255,.08)}
.row1::after{width:160px;height:160px;right:180px;bottom:-110px;background:rgba(255,255,255,.06)}
.row1>*{position:relative;z-index:1}
.brand{display:flex;flex-direction:column;gap:4px;min-width:0}
.brand .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.78)}
.brand .eyebrow i{display:inline-flex;gap:3px}
.brand .eyebrow i b{width:7px;height:7px;border-radius:2px;background:#fff;opacity:.9}
.brand .eyebrow i b:nth-child(2){opacity:.6}.brand .eyebrow i b:nth-child(3){opacity:.35}
.brand h1{margin:0;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:-.015em;text-wrap:balance;color:#fff}
.brand h1 span{color:#9fd0ff}
.brand p{margin:0;color:rgba(255,255,255,.82);font-size:13px}
.row1 .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
.row1 .btn:hover{background:rgba(255,255,255,.26)}
.row1 .btn.primary{background:#fff;color:#0f3aa8;border-color:#fff}
.row1 .btn.primary:hover{filter:none;background:#e9f0ff}
.row1 .who{color:rgba(255,255,255,.85)!important}
.row1 .who input{background:rgba(255,255,255,.95)!important;border-color:transparent!important;color:var(--fg)}
.row1 .mode{color:rgba(255,255,255,.7)!important}
.row1 .who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.who input{width:150px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mode{font-size:12px;color:var(--muted)}
.ro{color:#fff;border-color:rgba(255,255,255,.5)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.search{flex:1 1 200px;min-width:0;max-width:340px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.small{padding:3px 8px;font-size:12.5px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.who input{width:150px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.mode{font-size:12px;color:var(--muted)}
.ro{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:5px 9px}

/* Blocos de resumo */
.pipe{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:10px}
.pipe .st{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:12px 12px 11px;border-radius:12px;color:#fff;min-width:0;
  background:linear-gradient(135deg,var(--ec) 0%,color-mix(in srgb,var(--ec) 72%,#fff) 100%);box-shadow:0 3px 10px color-mix(in srgb,var(--ec) 28%,transparent)}
.pipe .st::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;right:-28px;top:-34px;background:rgba(255,255,255,.14);pointer-events:none}
.pipe .st.total{--ec:#0b3d91}
.pipe .l{position:relative;font-size:11.5px;font-weight:600;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.5em}
.pipe .n{position:relative;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.pipe .d{position:relative;font-size:11px;color:rgba(255,255,255,.85);line-height:1.3}
@media (max-width:1100px){.pipe{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-width:640px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}.pipe .n{font-size:22px}.brand h1{font-size:22px}}

.wrap{flex:1;min-height:0;overflow:auto;padding-bottom:24px}
.grid{display:grid;grid-template-columns:repeat(8,minmax(var(--col),1fr));gap:0 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:calc(8*var(--col) + 7*8px + 32px);box-sizing:border-box}
.colh{position:sticky;top:0;z-index:3;background:var(--bg);padding:10px 2px 8px;display:flex;gap:7px;align-items:flex-start;border-bottom:2px solid var(--ec)}
.colh .num{font-family:var(--f-mono);font-size:11px;font-weight:500;color:#fff;background:var(--ec);border-radius:4px;padding:1px 5px;flex:none;margin-top:1px}
.colh .t{font-size:12.5px;font-weight:600;line-height:1.25}
.colh .c{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.lane{grid-column:1/-1;margin-top:14px;padding:8px 0 6px;border-top:1px solid var(--line)}
.lane-in{position:sticky;left:max(16px,env(safe-area-inset-left,0px));display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px 10px;max-width:calc(100vw - 32px)}
.tog{border:0;background:transparent;cursor:pointer;padding:2px 4px;color:var(--muted);font-size:12px;width:22px}
.sig{font-family:var(--f-display);font-weight:700;font-size:15px}
.oname{color:var(--muted);font-size:13px;min-width:0}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px}
.tag.estadual{color:var(--estadual);background:var(--estadual-soft)}
.tag.federal{color:var(--federal);background:var(--federal-soft)}
.ext{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--accent);text-decoration:none;font-weight:500}
.ext:hover{text-decoration:underline}
.ext.none{color:var(--muted);font-weight:400;font-style:italic}
.bar{display:inline-flex;width:112px;height:7px;border-radius:4px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%;background:var(--ec)}
.prog{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.cell{display:flex;flex-direction:column;gap:7px;padding:7px;min-height:46px;border-radius:8px;background:var(--sunk);margin-top:6px}
.cell.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.board-geral .cell{min-height:60vh}

.card{background:var(--ec);color:#fff;border:1px solid var(--ec);border-radius:10px;padding:9px 10px 8px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.card:hover{filter:brightness(1.07);box-shadow:0 4px 12px color-mix(in srgb,var(--ec) 40%,transparent)}
.card .stg{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.card.dragging{opacity:.45}
.card .nm{font-weight:600;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere;color:#fff}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:11.5px;color:rgba(255,255,255,.9)}
.chip{font-family:var(--f-mono);font-size:11px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:1px 5px;color:#fff}
.osig{font-weight:600;font-size:11px;background:rgba(255,255,255,.22);border-radius:999px;padding:1px 7px}
.osig.estadual,.osig.federal{color:#fff}
.mv{display:flex;align-items:center;gap:4px;margin-top:1px}
.mv button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.15);color:#fff!important;border-radius:5px;width:26px;height:22px;cursor:pointer;color:var(--muted);line-height:1}
.mv button:hover:not(:disabled){background:rgba(255,255,255,.32)}
.mv button:disabled{opacity:.3;cursor:default}
.mv .links{margin-left:auto;display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mv .ext{font-size:12px;color:#fff;text-decoration:underline;text-underline-offset:2px}
.mv .ext.ba{font-weight:600}
.addsv{border:1px dashed var(--line);background:transparent;border-radius:7px;padding:5px;color:var(--muted);cursor:pointer;font-size:12.5px}
.addsv:hover{color:var(--accent);border-color:var(--accent)}

.empty{grid-column:1/-1;margin:40px auto;max-width:460px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h2{margin:0;color:var(--fg);font-family:var(--f-display);font-size:17px}

.ov{position:fixed;inset:0;background:rgba(10,16,24,.45);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px));overflow:auto}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);box-shadow:0 10px 40px rgba(0,0,0,.2);display:flex;flex-direction:column}
.dlg header{padding:16px 18px 6px;display:flex;flex-direction:column;gap:2px}
.dlg h2{margin:0;font-family:var(--f-display);font-size:17px}
.dlg header p{margin:0;color:var(--muted);font-size:12.5px}
.form{padding:10px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.f input,.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
.f textarea{min-height:70px;resize:vertical}
.dt{position:relative;display:flex}
.dt input[type=text]{flex:1;padding-right:40px}
.dt .cal{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:30px;display:grid;place-items:center;color:var(--muted);border-radius:6px;pointer-events:none}
.dt input[type=date]{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:30px;padding:0;border:0;opacity:0;cursor:pointer}
.dt input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;cursor:pointer}
.dt:hover .cal{color:var(--accent);background:var(--accent-soft)}
.f .hint{font-size:11.5px;color:var(--muted)}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.dlg footer{padding:12px 18px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.dlg footer .sp{flex:1}
.dlg.rel{width:min(860px,100%)}
#relTxt{min-height:min(60vh,520px);font-family:var(--f-mono);font-size:12.5px;line-height:1.5;white-space:pre-wrap;overflow:auto;background:var(--sunk)}
.audit{padding:0 18px 10px;font-size:12px;color:var(--muted)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;z-index:30;font-size:13px;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .12s}}
</style>
</head>
<body>
<div class="top">
  <div class="row1">
    <div class="brand">
      <span class="eyebrow"><i aria-hidden="true"><b></b><b></b><b></b></i>Planejamento 2027</span>
      <h1>Redirecionamentos <span>ba.gov.br</span></h1>
      <p>Órgãos e serviços que serão redirecionados para plataformas externas · <span class="mode" id="mode"></span></p>
    </div>
    <div class="row2">
      <label class="who" for="nome">Seu nome <input id="nome" type="text" placeholder="para o histórico" autocomplete="name"></label>
      <span class="ro" id="ro" hidden>Somente leitura</span>
      <button class="btn" id="btnRel" type="button">Relatório</button>
      <button class="btn primary" id="btnOrgao" type="button">+ Órgão</button>
      <button class="btn" id="btnServico" type="button">+ Serviço</button>
    </div>
  </div>
  <div class="row2">
    <div class="seg" role="group" aria-label="Visualização">
      <button type="button" data-view="orgao" aria-pressed="true">Por órgão</button>
      <button type="button" data-view="geral" aria-pressed="false">Quadro geral</button>
    </div>
    <div class="seg" role="group" aria-label="Esfera">
      <button type="button" data-esf="todos" aria-pressed="true">Todos</button>
      <button type="button" data-esf="estadual" aria-pressed="false">Estaduais</button>
      <button type="button" data-esf="federal" aria-pressed="false">Federais</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Buscar órgão ou serviço…" aria-label="Buscar">
  </div>
  <div class="pipe" id="pipe"></div>
</div>
<div class="wrap" id="wrap"><div class="grid" id="board"></div></div>
<div id="modal"></div>
<div class="toast" id="toast" hidden></div>

<script>
const ETAPAS = [
  "Serviços planejados",
  "Cadastro na Carta de Serviços",
  "Cadastro no ambiente de homologação do ba.gov.br",
  "Solicitação do ID do serviço e ID da etapa",
  "Abertura do Redmine para o link de redirecionamento",
  "Homologação do serviço em homologação",
  "Subida para produção",
  "Em produção"
];
const ESF = {estadual:"Estadual", federal:"Federal"};
const S = {orgaos:new Map(), servicos:new Map(), loaded:{o:false,s:false}, db:null, user:null, uid:null, canWrite:true, dbState:"loading"};
const UI = {view:"orgao", esf:"todos", q:"", collapsed:new Set()};
try{const p=JSON.parse(localStorage.getItem("redir-ui")||"{}"); if(p.view)UI.view=p.view; if(p.esf)UI.esf=p.esf; if(p.collapsed)UI.collapsed=new Set(p.collapsed);}catch(e){}
function saveUI(){try{localStorage.setItem("redir-ui",JSON.stringify({view:UI.view,esf:UI.esf,collapsed:[...UI.collapsed]}))}catch(e){}}

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function href(u){u=String(u||"").trim(); if(!u)return ""; if(!/^https?:\/\//i.test(u)) u="https://"+u; return u;}
function host(u){try{return new URL(href(u)).hostname.replace(/^www\./,"")}catch(e){return u}}
const ec = i => `--ec:var(--e${i});--tc:var(--t${i})`;
const LAST = ETAPAS.length-1; // "Em produção"
const num = i => i<LAST ? String(i+1) : "✓";
function toast(msg){const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200);}

/* Escritas: uma por documento de cada vez */
const chains = {};
function write(path, fn){
  chains[path] = (chains[path]||Promise.resolve()).then(fn).catch(e=>{
    if(e && e.code==="invalid_argument"){S.canWrite=false; applyRO(); toast("Você não tem permissão para editar este painel.");}
    else toast("Não foi possível salvar. Tente de novo em instantes.");
    console.error(e);
  });
  return chains[path];
}
function stamp(){return {atualizadoEm:new Date().toISOString(), atualizadoPor:S.uid||null}}

/* Dados derivados */
function orgList(){
  return [...S.orgaos.values()].sort((a,b)=> (a.esfera===b.esfera?0:(a.esfera==="estadual"?-1:1)) || (a.ordem??999)-(b.ordem??999) || String(a.sigla).localeCompare(b.sigla,"pt-BR"));
}
function svOf(oid){return [...S.servicos.values()].filter(s=>s.orgaoId===oid).sort((a,b)=>(a.ordem??999)-(b.ordem??999)||String(a.nome).localeCompare(b.nome,"pt-BR"));}
function norm(s){return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();}
function visible(){
  const q=norm(UI.q); const out=[];
  for(const o of orgList()){
    if(UI.esf!=="todos" && o.esfera!==UI.esf) continue;
    let svs=svOf(o.id);
    const om = !q || norm(o.sigla+" "+o.nome).includes(q);
    if(!om){ svs=svs.filter(s=>norm(s.nome).includes(q)); if(!svs.length) continue; }
    out.push({o,svs});
  }
  return out;
}

/* Render */
function render(){
  const vis=visible();
  const counts=Array(ETAPAS.length).fill(0); vis.forEach(v=>v.svs.forEach(s=>counts[s.etapa|0]++));
  const tot=counts.reduce((a,b)=>a+b,0), est=vis.filter(v=>v.o.esfera==="estadual").length, fed=vis.length-est;
  const pct=n=>tot?Math.round(n/tot*100)+"% do total":"—";
  $("#pipe").innerHTML = `<div class="st total"><span class="l">Total de serviços</span><span class="n">${tot}</span><span class="d">${vis.length} órgão${vis.length===1?"":"s"} · ${est} estadua${est===1?"l":"is"} · ${fed} federa${fed===1?"l":"is"}</span></div>`
    + ETAPAS.map((t,i)=>`<div class="st" style="${ec(i)}" title="${esc(t)}"><span class="l">${i<LAST?(i+1)+". ":"✓ "}${esc(t)}</span><span class="n">${counts[i]}</span><span class="d">${pct(counts[i])}</span></div>`).join("");
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===UI.view));
  document.querySelectorAll("[data-esf]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.esf===UI.esf));

  const board=$("#board");
  board.className="grid board-"+UI.view;
  let h = ETAPAS.map((t,i)=>`<div class="colh" style="${ec(i)}"><span class="num">${num(i)}</span><span class="t">${esc(t)}</span><span class="c">${counts[i]}</span></div>`).join("");

  if(S.dbState==="off"){
    h += `<div class="empty"><h2>O painel não conseguiu carregar os dados</h2><p>Verifique a configuração do Firebase no início do script ou recarregue a página.</p></div>`;
  } else if(S.dbState==="loading"){
    h += `<div class="empty"><p>Carregando órgãos e serviços…</p></div>`;
  } else if(!S.orgaos.size){
    h += `<div class="empty"><h2>Nenhum órgão cadastrado</h2><p>Comece por <b>+ Órgão</b> e depois adicione os serviços de cada um. Cada serviço começa em "Serviços planejados" e anda pelas etapas até entrar em produção.</p></div>`;
  } else if(!vis.length){
    h += `<div class="empty"><p>Nada encontrado com esses filtros.</p></div>`;
  } else if(UI.view==="orgao"){
    for(const {o,svs} of vis){
      const col=UI.collapsed.has(o.id);
      const done=svs.filter(s=>(s.etapa|0)===LAST).length;
      const dist=Array(ETAPAS.length).fill(0); svs.forEach(s=>dist[s.etapa|0]++);
      const bar = svs.length ? dist.map((n,i)=>n?`<i style="${ec(i)};width:${n/svs.length*100}%"></i>`:"").join("") : "";
      h += `<div class="lane"><div class="lane-in">
        <button class="tog" type="button" data-tog="${o.id}" aria-label="${col?"Expandir":"Recolher"} ${esc(o.sigla)}" aria-expanded="${!col}">${col?"▶":"▼"}</button>
        <span class="sig">${esc(o.sigla||o.nome)}</span>
        ${o.sigla&&o.nome?`<span class="oname">${esc(o.nome)}</span>`:""}
        <span class="tag ${o.esfera}">${ESF[o.esfera]||""}</span>
        ${o.link?`<a class="ext" href="${esc(href(o.link))}" target="_blank" rel="noopener noreferrer">${esc(host(o.link))} ↗</a>`:`<span class="ext none">sem link</span>`}
        <span class="bar" title="Distribuição dos serviços por etapa">${bar}</span>
        <span class="prog">${done}/${svs.length} em produção</span>
        <span class="w"><button class="btn small" type="button" data-edit-org="${o.id}">Editar</button> <button class="btn small" type="button" data-add-sv="${o.id}">+ Serviço</button></span>
      </div></div>`;
      if(col) continue;
      for(let i=0;i<ETAPAS.length;i++){
        const cs=svs.filter(s=>(s.etapa|0)===i);
        h += `<div class="cell" data-cell="${i}" data-org="${o.id}">${cs.map(s=>card(s,false)).join("")}${i===0?`<button class="addsv w" type="button" data-add-sv="${o.id}">+ serviço</button>`:""}</div>`;
      }
    }
  } else {
    for(let i=0;i<ETAPAS.length;i++){
      const cs=[]; vis.forEach(v=>v.svs.forEach(s=>{if((s.etapa|0)===i)cs.push(s)}));
      h += `<div class="cell" data-cell="${i}">${cs.map(s=>card(s,true)).join("")}</div>`;
    }
  }
  board.innerHTML=h;
  applyRO();
}
function card(s,showOrg){
  const e=s.etapa|0; const o=S.orgaos.get(s.orgaoId)||{};
  const meta=[];
  if(showOrg) meta.push(`<span class="osig ${o.esfera||""}">${esc(o.sigla||o.nome||"")}</span>`);
  if(s.idServico) meta.push(`<span class="chip" title="ID do serviço">serv ${esc(s.idServico)}</span>`);
  if(s.idEtapa) meta.push(`<span class="chip" title="ID da etapa">etapa ${esc(s.idEtapa)}</span>`);
  if(s.redmine) meta.push(`<span class="chip" title="Chamado no Redmine">#${esc(s.redmine)}</span>`);
  if(s.dataConclusao) meta.push(`<span class="chip" title="Data de conclusão">concluído ${esc(s.dataConclusao)}</span>`);
  else if(s.previsaoSubida) meta.push(`<span class="chip" title="Previsão de subida no ba.gov.br">prev. ${esc(s.previsaoSubida)}</span>`);
  return `<div class="card" draggable="true" data-sv="${s.id}" style="${ec(e)}" tabindex="0" role="button" aria-label="${esc(s.nome)}, etapa: ${esc(ETAPAS[e])}">
    <div class="stg">${num(e)} · ${esc(ETAPAS[e])}</div>
    <div class="nm">${esc(s.nome)}</div>
    ${meta.length?`<div class="meta">${meta.join("")}</div>`:""}
    <div class="mv">
      <button class="w" type="button" data-mv="-1" data-id="${s.id}" ${e===0?"disabled":""} aria-label="Voltar etapa">‹</button>
      <button class="w" type="button" data-mv="1" data-id="${s.id}" ${e===LAST?"disabled":""} aria-label="Avançar etapa">›</button>
      <span class="links">${s.linkBa?`<a class="ext ba" href="${esc(href(s.linkBa))}" target="_blank" rel="noopener noreferrer" title="${esc(href(s.linkBa))}">ba.gov.br ↗</a>`:""}${s.link?`<a class="ext" href="${esc(href(s.link))}" target="_blank" rel="noopener noreferrer" title="${esc(href(s.link))}">origem ↗</a>`:""}</span>
    </div>
  </div>`;
}
function applyRO(){
  const ro=!S.canWrite || S.dbState!=="on";
  $("#ro").hidden = !( !S.canWrite && S.dbState==="on");
  $("#btnOrgao").hidden=ro; $("#btnServico").hidden=ro;

/* Ações */
function hoje(){return new Date().toLocaleDateString("pt-BR");}
// ao chegar em "Em produção" sem data de conclusão, preenche com a data de hoje
function autoConclusao(s,etapa){return etapa===LAST && !s.dataConclusao ? {dataConclusao:hoje()} : {};}
function moveSv(id, etapa){
  const s=S.servicos.get(id); if(!s||!S.db) return;
  etapa=Math.max(0,Math.min(LAST,etapa)); if((s.etapa|0)===etapa) return;
  write("servicos/"+id, ()=>S.db.doc("servicos/"+id).update({etapa, ...autoConclusao(s,etapa), ...stamp()}));
}

document.addEventListener("click", e=>{
  const t=e.target.closest("button,[data-sv],a"); if(!t) return;
  if(t.tagName==="A") return;
  if(t.dataset.view){UI.view=t.dataset.view; saveUI(); render(); return;}
  if(t.dataset.esf){UI.esf=t.dataset.esf; saveUI(); render(); return;}
  if(t.dataset.tog){const id=t.dataset.tog; UI.collapsed.has(id)?UI.collapsed.delete(id):UI.collapsed.add(id); saveUI(); render(); return;}
  if(t.dataset.mv){const s=S.servicos.get(t.dataset.id); if(s) moveSv(s.id,(s.etapa|0)+Number(t.dataset.mv)); return;}
  if(t.dataset.editOrg){openOrg(t.dataset.editOrg); return;}
  if(t.dataset.addSv){openSv(null,t.dataset.addSv); return;}
  if(t.id==="btnOrgao"){openOrg(null); return;}
  if(t.id==="btnServico"){openSv(null,null); return;}
  if(t.id==="btnRel"){openRel(); return;}
  if(t.dataset.sv && t.classList.contains("card")){openSv(t.dataset.sv); return;}
});
document.addEventListener("keydown", e=>{

});

/* Relatório em texto */
function reportText(){
  const vis=visible(), d=new Date();
  const L=[], sep="─".repeat(56);
  const tot=vis.reduce((a,v)=>a+v.svs.length,0);
  const est=vis.filter(v=>v.o.esfera==="estadual").length;
  const etq=i=>(i<LAST?(i+1)+". ":"✓ ")+ETAPAS[i];
  const filtros=[UI.esf==="todos"?"todos os órgãos":(UI.esf==="estadual"?"só estaduais":"só federais")]; if(UI.q.trim()) filtros.push(`busca "${UI.q.trim()}"`);
  L.push("RELATÓRIO DE REDIRECIONAMENTOS – ba.gov.br");
  L.push(`Gerado em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})} · ${filtros.join(" · ")}`);
  L.push("", "RESUMO", sep);
  L.push(`${tot} serviço${tot===1?"":"s"} em ${vis.length} órgão${vis.length===1?"":"s"} (${est} estadua${est===1?"l":"is"}, ${vis.length-est} federa${vis.length-est===1?"l":"is"})`);
  ETAPAS.forEach((t,i)=>{const n=vis.reduce((a,v)=>a+v.svs.filter(s=>(s.etapa|0)===i).length,0); L.push(`  ${etq(i)}: ${n}${tot?` (${Math.round(n/tot*100)}%)`:""}`);});
  const semSv=vis.filter(v=>!v.svs.length).map(v=>v.o.sigla||v.o.nome);
  if(semSv.length) L.push(`  Órgãos ainda sem serviço cadastrado: ${semSv.length} (${semSv.join(", ")})`);
  L.push("", "POR ÓRGÃO", sep);
  for(const {o,svs} of vis){
    L.push(`${o.sigla||o.nome}${o.sigla&&o.nome?" – "+o.nome:""} (${ESF[o.esfera]||""})`);
    if(o.link) L.push(`  Site: ${href(o.link)}`);
    if(!svs.length) L.push("  Nenhum serviço cadastrado.");
    for(const s of svs){
      const ex=[]; if(s.redmine)ex.push("Redmine #"+s.redmine); if(s.idServico)ex.push("ID serviço "+s.idServico); if(s.idEtapa)ex.push("ID etapa "+s.idEtapa); if(s.responsavel)ex.push("resp. "+s.responsavel);
      L.push(`  • ${s.nome} → ${etq(s.etapa|0)}${ex.length?"  ["+ex.join(" · ")+"]":""}`);
      if(s.linkBa) L.push(`      ba.gov.br: ${href(s.linkBa)}`);
      if(s.link) L.push(`      origem: ${href(s.link)}`);
      if(s.previsaoSubida) L.push(`      previsão de subida: ${s.previsaoSubida}`);
      if(s.dataConclusao) L.push(`      concluído em: ${s.dataConclusao}`);
      if(s.obs) L.push(`      obs.: ${s.obs.replace(/\s+/g," ")}`);
    }
    L.push("");
  }
  L.push("POR ETAPA", sep);
  ETAPAS.forEach((t,i)=>{
    const it=[]; vis.forEach(v=>v.svs.forEach(s=>{if((s.etapa|0)===i) it.push(`  • ${s.nome} (${v.o.sigla||v.o.nome})`);}));
    L.push(`${etq(i)} – ${it.length}`); L.push(...(it.length?it:["  —"])); L.push("");
  });
  return L.join("\n").trim()+"\n";
}

async function auditLine(doc){
  if(!doc||!doc.atualizadoEm) return "";
  let quem="";
  if(doc.atualizadoPor && !/^u_/.test(doc.atualizadoPor)) quem=doc.atualizadoPor;
  const d=new Date(doc.atualizadoEm);
  return `Última alteração em ${d.toLocaleDateString("pt-BR")} às ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}${quem?" por "+esc(quem):""}`;
}
function shell(title,sub,body,isEdit,delLabel){
  $("#modal").innerHTML=`<div class="ov" id="ov"><form class="dlg" id="dlg" novalidate>
    <header><h2>${esc(title)}</h2>${sub?`<p>${sub}</p>`:""}</header>
    <div class="form">${body}</div>
    <div class="audit" id="audit"></div>
    <footer>${isEdit?`<button class="btn danger" type="button" id="del">${esc(delLabel)}</button>`:""}<span class="sp"></span>
      <button class="btn" type="button" id="cancel">Cancelar</button><button class="btn primary" type="submit" id="save">Salvar</button></footer>
  </form></div>`;
  $("#ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal();});
  $("#cancel").onclick=closeModal;
  const ro=!S.canWrite; if(ro){$("#save").hidden=true; const d=$("#del"); if(d)d.hidden=true; document.querySelectorAll("#dlg input,#dlg select,#dlg textarea").forEach(x=>x.disabled=true);}
  setTimeout(()=>{const f=$("#dlg input:not([disabled])"); f&&f.focus();},30);
}
function armDelete(label, run){
  const b=$("#del"); if(!b) return;
  b.onclick=()=>{ if(b.classList.contains("armed")){run(); closeModal();} else {b.classList.add("armed"); b.textContent=label;} };
}
function openOrg(id){
  const o=id?S.orgaos.get(id):null; const n=id?svOf(id).length:0;
  shell(o?"Editar órgão":"Novo órgão", o?"":"Depois de salvar, adicione os serviços deste órgão.", `
    <div class="f"><label for="o_sigla">Sigla</label><input id="o_sigla" value="${esc(o?.sigla)}" placeholder="Ex.: Crea-BA"></div>
    <div class="f"><label for="o_esf">Esfera</label><select id="o_esf"><option value="estadual">Estadual</option><option value="federal">Federal</option></select></div>
    <div class="f full"><label for="o_nome">Nome completo</label><input id="o_nome" value="${esc(o?.nome)}" placeholder="Ex.: Conselho Regional de Engenharia e Agronomia da Bahia"></div>
    <div class="f full"><label for="o_link">Site ou plataforma do órgão</label><input id="o_link" value="${esc(o?.link)}" placeholder="https://…" inputmode="url"><span class="hint">Clicar no link do painel abre esse endereço.</span></div>
    <div class="f full"><label for="o_obs">Observações</label><textarea id="o_obs">${esc(o?.obs)}</textarea></div>`,

  armDelete(n?`Confirmar: excluir órgão e ${n} serviço${n>1?"s":""}`:"Confirmar exclusão", ()=>{
    svOf(id).forEach(s=>write("servicos/"+s.id,()=>S.db.doc("servicos/"+s.id).delete()));

  });
  $("#dlg").onsubmit=e=>{e.preventDefault();

    closeModal(); toast(o?"Órgão atualizado.":"Órgão adicionado.");
  };
}

const ORIG_IDS = ["orgaos/coren-ba", "orgaos/crea-ba", "orgaos/cremeb", "orgaos/cro-ba", "orgaos/crf-ba", "orgaos/crc-ba", "orgaos/cra-ba", "orgaos/core-ba", "orgaos/crt-ba", "orgaos/crefito-7", "orgaos/cref13", "orgaos/crdd-ba", "orgaos/crq-7", "orgaos/oab-ba", "orgaos/progsociais", "servicos/bolsa-familia", "servicos/tarifa-social", "servicos/bpc", "servicos/scfv", "servicos/id-jovem", "servicos/crianca-feliz"]; // itens da primeira versão da lista

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s);});}
function rid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}

/* Banco local (localStorage) com a mesma interface usada pelo painel */
function localDb(){
  const KEY="redir-dados-v1"; const subs={orgaos:[],servicos:[]};
  let data;
  try{data=JSON.parse(localStorage.getItem(KEY)||"null");}catch(e){}
  if(!data||!data.orgaos) data={...JSON.parse(JSON.stringify(SEED)),v:2,seen:[]};
  // v2: nova etapa "Serviços planejados" na frente; serviços já movidos avançam uma posição
  if(!data.v){ Object.values(data.servicos||{}).forEach(x=>{ if(x.atualizadoEm) x.etapa=(x.etapa|0)+1; }); data.v=2; }
  // itens novos da lista base entram uma vez só (os que alguém excluiu não voltam)
  if(!data.seen) data.seen=ORIG_IDS.slice();
  for(const col of ["orgaos","servicos"]) for(const [id,d] of Object.entries(SEED[col])){ const k=col+"/"+id; if(!data.seen.includes(k)){ if(!data[col][id]) data[col][id]={...d}; data.seen.push(k);} }
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast("Não foi possível salvar no navegador.");}};
  persist();
  const snap=col=>({docs:Object.entries(data[col]||{}).map(([id,d])=>({id,data:()=>d}))});
  const emit=col=>subs[col].forEach(cb=>cb(snap(col)));
  window.addEventListener("storage",e=>{if(e.key!==KEY)return; try{data=JSON.parse(e.newValue)||data;}catch(x){} emit("orgaos"); emit("servicos");});
  const ref=(col,id)=>({id,path:col+"/"+id,
    set:async d=>{(data[col]=data[col]||{})[id]={...d}; persist(); emit(col);},
    update:async d=>{data[col][id]={...(data[col][id]||{}),...d}; persist(); emit(col);},
    delete:async()=>{delete data[col][id]; persist(); emit(col);}});
  return {kind:"local",
    doc:path=>{const [c,id]=path.split("/"); return ref(c,id);},
    collection:col=>({doc:id=>ref(col,id||rid()), onSnapshot:(cb)=>{subs[col].push(cb); cb(snap(col)); return ()=>{};}}),
    replaceAll:async d=>{data={orgaos:d.orgaos||{},servicos:d.servicos||{},v:2}; persist(); emit("orgaos"); emit("servicos");}};
}

/* Banco compartilhado (Firebase Firestore) */
async function firebaseDb(cfg){
  const V="10.12.2";
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore-compat.js`);
  firebase.initializeApp(cfg); const fs=firebase.firestore();
  const ref=(col,id)=>{const r=fs.collection(col).doc(id); return {id:r.id,path:col+"/"+r.id,set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete()};};
  const meta=await fs.collection("meta").doc("seed").get();
  { const seen = meta.exists ? (meta.data().ids || ORIG_IDS) : []; const b=fs.batch(); let n=0;
    for(const col of ["orgaos","servicos"]) for(const [id,d] of Object.entries(SEED[col])){ const k=col+"/"+id; if(!seen.includes(k)){ b.set(fs.collection(col).doc(id),d); seen.push(k); n++; } }
    if(n||!meta.exists){ b.set(fs.collection("meta").doc("seed"),{em:new Date().toISOString(), ids:seen}); await b.commit(); } }
  return {kind:"firebase",
    doc:path=>{const [c,id]=path.split("/"); return ref(c,id);},
    collection:col=>({doc:id=>id?ref(col,id):ref(col,fs.collection(col).doc().id),
      onSnapshot:(cb,err)=>fs.collection(col).onSnapshot(q=>cb({docs:q.docs.map(d=>({id:d.id,data:()=>d.data()}))}),err)}),
    replaceAll:async d=>{const b=fs.batch(); for(const col of ["orgaos","servicos"]) for(const [id,x] of Object.entries(d[col]||{})) b.set(fs.collection(col).doc(id),x); await b.commit();}};
}

/* Nome de quem edita (fica no navegador) */
try{S.uid=localStorage.getItem("redir-nome")||null;}catch(e){}
$("#nome").value=S.uid||"";
$("#nome").addEventListener("change",e=>{S.uid=e.target.value.trim()||null; try{localStorage.setItem("redir-nome",S.uid||"");}catch(x){}});

render();
(async()=>{
  let db;
  try{ db = FIREBASE_CONFIG ? await firebaseDb(FIREBASE_CONFIG) : localDb(); }
  catch(e){ console.error(e); S.dbState="off"; render(); return; }
  S.db=db;
  $("#mode").textContent = db.kind==="firebase" ? "dados compartilhados (Firebase)" : "dados salvos neste navegador";
  const onErr=e=>{console.error(e); toast("A conexão com os dados caiu. Recarregue a página.");};
  const fill=(map,key)=>snap=>{map.clear(); snap.docs.forEach(d=>map.set(d.id,{id:d.id,...d.data()})); S.loaded[key]=true; if(S.loaded.o&&S.loaded.s)S.dbState="on"; render();};
  db.collection("orgaos").onSnapshot(fill(S.orgaos,"o"), onErr);
  db.collection("servicos").onSnapshot(fill(S.servicos,"s"), onErr);
})();
